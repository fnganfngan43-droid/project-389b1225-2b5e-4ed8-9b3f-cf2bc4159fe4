name: Build Fares Accounting APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        run: |
          mkdir -p android-app/app/src/main/java/com/fares/accounting android-app/app/src/main/res/values
          cat > android-app/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name="FaresAccounting"
          include(":app")
          EOF
          cat > android-app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF
          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.fares.accounting'
            compileSdk 35
            defaultConfig {
              applicationId 'com.fares.accounting'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          EOF
          cat > android-app/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">رفيق المحاسب</string></resources>
          EOF
          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#1976D2</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:statusBarColor">#000000</item>
            </style>
          </resources>
          EOF
          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="@string/app_name" android:theme="@style/AppTheme" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > android-app/app/src/main/java/com/fares/accounting/MainActivity.java <<'EOF'
          package com.fares.accounting;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          import android.content.Intent;
          import android.net.Uri;

          public class MainActivity extends Activity {
            WebView w;
            ValueCallback<Uri[]> callback;
            static final int FILES=1001;
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              w=new WebView(this); setContentView(w);
              WebSettings s=w.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true);
              CookieManager.getInstance().setAcceptCookie(true);
              CookieManager.getInstance().setAcceptThirdPartyCookies(w,true);
              w.setWebViewClient(new WebViewClient());
              w.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> c, FileChooserParams f) {
                  callback=c;
                  try { startActivityForResult(f.createIntent(),FILES); } catch(Exception e) { callback=null; c.onReceiveValue(null); }
                  return true;
                }
              });
              w.loadUrl("https://fares-2026.lovable.app/");
            }
            @Override protected void onActivityResult(int r,int c,Intent d) {
              super.onActivityResult(r,c,d);
              if(r==FILES && callback!=null) {
                Uri[] x=null;
                if(c==RESULT_OK && d!=null) {
                  if(d.getClipData()!=null) {
                    int n=d.getClipData().getItemCount(); x=new Uri[n];
                    for(int i=0;i<n;i++) x[i]=d.getClipData().getItemAt(i).getUri();
                  } else if(d.getData()!=null) x=new Uri[]{d.getData()};
                }
                callback.onReceiveValue(x); callback=null;
              }
            }
            @Override public void onBackPressed() {
              if(w.canGoBack()) w.goBack(); else super.onBackPressed();
            }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android-app
        run: gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fares-Accounting-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
